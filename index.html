<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDE6D3">
<title>A Menza · Zárás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#EDE6D3;--paper:#FBF8F1;--ink:#1E1B18;--mute:#7A7266;--line:#E3DAC4;
  --orange:#E9A21B;--teal:#17B69A;--red:#E01B0F;
  --grad:linear-gradient(120deg,#E9A21B 0%,#E01B0F 100%);
  --shadow:0 1px 2px rgba(30,27,24,.06),0 18px 40px -18px rgba(30,27,24,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400;letter-spacing:.2px}
button{font:inherit}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:-1;animation:drift 20s ease-in-out infinite alternate;pointer-events:none}
.b1{width:440px;height:440px;background:var(--orange);top:-170px;left:-130px}
.b2{width:400px;height:400px;background:var(--teal);bottom:-160px;right:-130px;animation-duration:26s}
.b3{width:300px;height:300px;background:var(--red);top:38%;left:58%;opacity:.22;animation-duration:30s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.12)}}

@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:none}}
@keyframes rise2{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,27,15,.45)}100%{box-shadow:0 0 0 22px rgba(224,27,15,0)}}

/* logó */
.logo .c{transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.2,1.2,.4,1) both}
.logo .c1{animation-delay:.05s}.logo .c2{animation-delay:.2s}.logo .c3{animation-delay:.35s}
.logo .cut{animation:fade .6s .6s both}
.logo .wm{animation:rise2 .8s .75s both}
.logo .ul{transform-box:fill-box;transform-origin:left center;animation:grow .7s both}
.logo .u1{animation-delay:1.05s}.logo .u2{animation-delay:1.2s}.logo .u3{animation-delay:1.35s}
.mark .logo *{animation:none!important}
.splash{min-height:100vh;display:grid;place-items:center;text-align:center}
.splash .logo{width:min(78vw,380px);height:auto}
.tagline{font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:var(--mute);animation:fade 1s 1.6s both;margin-top:-6px}

/* elrendezés */
#app{min-height:100vh;position:relative;padding-bottom:60px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}
.topbar{display:flex;align-items:center;gap:12px;max-width:780px;margin:0 auto;padding:18px 18px 8px}
.mark{flex:none}
.mark svg{width:96px;height:auto;display:block}
.topbar .hello{flex:1;min-width:0}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.topbar h1{margin:2px 0 0;font-size:28px;line-height:1.1}
.sp{flex:1}
.icon{border:0;background:rgba(255,255,255,.6);width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow)}
.notice{background:#FFF3D6;color:#6b4a0c;border-radius:18px;padding:14px 16px;margin:14px 0;font-size:14px;box-shadow:var(--shadow)}
.linkbtn{background:none;border:0;color:#5b5140;text-decoration:underline;font:inherit;cursor:pointer;padding:6px}
.muted{color:var(--mute)}
.small{font-size:13px}
.err{color:var(--red);font-weight:600;min-height:1.3em;margin:10px 2px}

/* gombok */
.btn{border:0;border-radius:18px;padding:16px 20px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.ok{background:var(--teal);color:#fff}
.btn.yes{background:var(--teal);color:#06302a}
.btn.danger{background:#FCE7E4;color:var(--red)}
.btn.grad{background:var(--grad);color:#fff;box-shadow:0 12px 30px -10px rgba(224,27,15,.6)}
.btn.block{width:100%}
.btn.big{min-height:76px;font-size:22px;letter-spacing:.04em}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:14px}
.btn.pill{border-radius:999px;padding:9px 16px;min-height:0;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink)}

/* kártyák, hero */
.card{background:var(--paper);border-radius:26px;padding:20px;box-shadow:var(--shadow);margin-top:16px}
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--cream);border-radius:30px;padding:24px;box-shadow:var(--shadow);margin-top:6px}
.hero::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(233,162,27,.55),transparent 65%);top:-140px;right:-100px}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(23,182,154,.45),transparent 65%);bottom:-130px;left:-80px}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;gap:8px}
.live{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;text-transform:none;letter-spacing:0;font-size:12px;white-space:nowrap}
.num{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(44px,11vw,64px);line-height:1;margin:14px 0 6px;font-variant-numeric:tabular-nums}
/* logó-alapú óra */
.clock3{display:flex;justify-content:center;align-items:center;margin:20px 0 0;padding:6px 0}
.cc{position:relative;width:clamp(92px,27vw,118px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:"DM Serif Display",Georgia,serif;font-size:clamp(38px,10.5vw,52px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;box-shadow:0 16px 30px -12px rgba(0,0,0,.55);animation:pop .8s cubic-bezier(.2,1.2,.4,1) both}
.cc span{display:block;transform-origin:center}
.cc span.tick{animation:tickNum .42s cubic-bezier(.2,.9,.3,1.3)}
@keyframes tickNum{from{transform:translateY(-22%) scale(.86);opacity:.2}to{transform:none;opacity:1}}
.cc-h{background:var(--orange);z-index:1;animation-delay:.05s}
.cc-m{background:var(--teal);margin-left:-16px;z-index:2;animation-delay:.2s}
.cc-s{background:var(--red);color:var(--paper);margin-left:-16px;z-index:3;animation-delay:.35s}
.cc-s span{position:relative;z-index:1}
.cc-s .ring{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);pointer-events:none;overflow:visible;z-index:0}
.cc-s .ring circle{fill:none;stroke:var(--paper);stroke-width:3;stroke-linecap:round;opacity:.9}
.clock-ul{display:flex;justify-content:center;margin:14px auto 0;max-width:calc(3 * clamp(92px,27vw,118px) - 32px)}
.clock-ul i{flex:1;height:5px;border-radius:3px;transform-origin:left center;animation:grow .7s both}
.clock-ul .u1{background:var(--orange);animation-delay:.7s}
.clock-ul .u2{background:var(--teal);animation-delay:.85s}
.clock-ul .u3{background:var(--red);animation-delay:1s}
.hero .clock-ul i{box-shadow:0 0 14px rgba(255,255,255,.08)}
.sec{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:22px;margin:26px 2px 10px}
.sec-l{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:20px;margin:22px 0 8px}

/* listák */
.items{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.item{--c:var(--teal);width:100%;border:0;font:inherit;text-align:left;color:var(--ink);display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:14px 16px 14px 20px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:transform .2s}
.item::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 6px 6px 0;background:var(--c)}
.item:hover{transform:translateX(4px)}
.item:disabled{opacity:.5;cursor:not-allowed;transform:none}
.item .info{flex:1;min-width:0;display:flex;flex-direction:column}
.item b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mute);margin-top:2px}
.item em{font-style:normal}
.item .mod{color:var(--orange);font-weight:600}
.item .amt{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.neg{color:var(--red)!important}
.empty{padding:22px;text-align:center;color:var(--mute);background:rgba(255,255,255,.45);border-radius:20px;border:1px dashed var(--line)}
.rv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #d9ccae}
.rv b{font-variant-numeric:tabular-nums;text-align:right}
.rv.sub{padding-left:14px;font-size:15px}
.ok{color:#0b7a68;font-weight:700}

/* kpi */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.kpi{background:var(--paper);border-radius:22px;padding:16px;box-shadow:var(--shadow);animation:rise .6s both;animation-delay:calc(var(--i,0)*80ms)}
.kpi span{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.kpi b{display:block;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:24px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.wide{grid-column:1/-1;background:var(--grad);color:#fff;box-shadow:0 16px 34px -14px rgba(224,27,15,.7);margin-top:16px}
.kpi.wide span{color:#fff;opacity:.9}
.kpi.wide b{font-size:44px;color:#fff}

/* szegmens */
.seg{display:flex;background:rgba(255,255,255,.55);border-radius:999px;padding:5px;gap:4px;margin-top:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.05);flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:0;background:transparent;padding:10px 10px;border-radius:999px;font-weight:600;color:var(--mute);cursor:pointer;transition:all .3s;font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.range label{margin:0}

/* diagramok */
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px;overflow-x:auto}
.bar{flex:1;min-width:34px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pair{display:flex;align-items:flex-end;gap:4px;width:100%;height:100%;justify-content:center}
.pair .fill{flex:1;max-width:22px}
.fill{width:100%;max-width:44px;height:var(--h);min-height:4px;background:linear-gradient(180deg,#2EE0BE 0%,#17B69A 55%,#0E8C75 100%);border-radius:14px 14px 8px 8px;transform-origin:bottom;animation:growY .9s cubic-bezier(.2,1.1,.3,1) both;animation-delay:var(--d);box-shadow:0 10px 20px -10px rgba(23,182,154,.8)}
.fill.fill-b{background:linear-gradient(180deg,#FFD27A 0%,#E9A21B 60%,#B97A07 100%);box-shadow:0 10px 20px -10px rgba(233,162,27,.8)}
.bar span{font-size:11px;color:var(--mute);margin-top:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{font-size:13px;color:var(--mute);margin-bottom:6px}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin:0 6px 0 14px;vertical-align:middle}
.lg.a{background:#17B69A}.lg.b{background:#E9A21B}
.hrow{display:grid;grid-template-columns:96px 1fr 110px;gap:12px;align-items:center;margin:12px 0}
.hrow span{font-size:14px;color:var(--mute)}
.hrow b{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.htrack{height:12px;background:#E9E2CF;border-radius:99px;overflow:hidden}
.htrack i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#E9A21B,#17B69A);border-radius:99px;transform-origin:left;animation:grow 1s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*120ms + 200ms)}

/* űrlap */
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px;letter-spacing:.02em}
.field{width:100%;padding:15px 16px;font-size:17px;border:1.5px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit}
.field:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(23,182,154,.18)}
.field[disabled]{background:#F3EEE1;color:var(--mute)}
.amount-wrap{position:relative}
.amount-wrap .field{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;padding:14px 60px 14px 18px;text-align:right}
.amount-wrap::after{content:"Ft";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--mute);pointer-events:none}
.row{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;margin-bottom:10px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.row .field{padding:12px 12px;font-size:16px}
.row .x{background:#eadfc8;border:0;border-radius:12px;font-size:20px;padding:0 14px;cursor:pointer}
.progress{display:flex;align-items:center;gap:12px;font-weight:700;margin-top:6px}
.progress .bar2{flex:1;height:10px;background:#d6cbb0;border-radius:99px;overflow:hidden}
.progress .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--teal),var(--red));transition:width .4s}
.nav{display:flex;gap:14px;margin-top:18px}
.nav .btn{flex:1}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.block-card{text-align:center;border:3px solid var(--red)}
.stop{width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--red);color:#fff;font-size:48px;font-weight:900;display:grid;place-items:center;animation:pop .5s both}
.fix{font-size:24px;font-weight:700;color:#7a1206}
.tag{display:inline-block;background:#FFF3D6;color:#6b4a0c;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px}
.hist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hist li{background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow)}
.hist li span{display:inline-block;color:var(--mute);margin-right:8px;font-variant-numeric:tabular-nums;font-size:12px}

/* banner, toast, fejlesztői kártya */
.demo-banner{max-width:744px;margin:10px auto 0;background:var(--ink);color:var(--paper);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;animation:rise .6s both;flex-wrap:wrap}
.demo-banner .btn{background:var(--grad);color:#fff;min-height:36px;padding:6px 14px;border-radius:12px;font-size:13px}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em}
.badge.dev{background:#fbd9a0;color:#6b3d00}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:var(--paper);padding:14px 20px;border-radius:14px;transition:transform .3s;max-width:90%;text-align:center;z-index:20;box-shadow:var(--shadow)}
#toast.on{transform:translateX(-50%) translateY(0)}
.exports{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.exports .btn{min-height:52px;padding:12px 10px;font-size:15px;color:#fff}
.devcard{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);border-radius:24px;padding:16px 18px;margin:6px 0 0;box-shadow:var(--shadow)}
.devcard .dc-text{flex:1;min-width:0}
.devcard b{display:block;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:20px}
.devcard small{opacity:.75;font-size:13px;line-height:1.4}
.devcard .btn{min-height:46px;padding:10px 18px;border-radius:14px;white-space:nowrap}
.fejl{display:flex;justify-content:flex-end;margin-top:10px}

/* mozgás: képernyőváltás, kérdések, zárás */
#app.fwd{animation:slideF .6s cubic-bezier(.2,.8,.2,1) both}
#app.back{animation:slideB .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideF{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.rv{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.btn.grad.big{animation:ring 2.4s ease-out infinite}
.qcard.pulse-ok{animation:okPulse .45s ease-out}
@keyframes okPulse{0%{transform:scale(1);box-shadow:var(--shadow)}40%{transform:scale(1.02);box-shadow:0 0 0 6px rgba(23,182,154,.35),var(--shadow)}100%{transform:none;box-shadow:var(--shadow)}}
.hero .num{animation:rise .8s .2s both}
.confetti{position:fixed;width:10px;height:14px;border-radius:3px;z-index:50;pointer-events:none;animation:confetti 1.8s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* gombok távolsága, díszítés */
.btn.block{margin-top:14px}
.btn.block:first-child{margin-top:0}
.btn.grad{position:relative;overflow:hidden}
.btn.grad::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.4s 1.2s infinite;pointer-events:none}
@keyframes sheen{to{transform:translateX(120%)}}
.mark svg{animation:glow 3.6s ease-in-out infinite 1.6s}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(233,162,27,0))}50%{filter:drop-shadow(0 12px 26px rgba(233,162,27,.35))}}

/* köszönő képernyő */
.thanks{font-size:clamp(26px,6.5vw,36px);line-height:1.25;margin:18px 0 6px;text-align:center}
.thanks span{display:inline-block;opacity:0;transform:translateY(18px) scale(.96);animation:letterIn .6s cubic-bezier(.2,.9,.25,1.2) forwards;animation-delay:calc(.35s + var(--i)*38ms)}
@keyframes letterIn{to{opacity:1;transform:none}}
.thanks-sub{text-align:center;color:var(--mute);margin:6px 0 4px;opacity:0;animation:fade .8s 1.6s forwards}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:420px){.kpis{grid-template-columns:1fr}.hrow{grid-template-columns:80px 1fr 96px}}

/* ---- Admin v3: nagy zárás-gombok, 3D kördiagram, végösszeg-finálé, fejlesztői menü ---- */
.closelist{display:flex;flex-direction:column;gap:18px;margin-top:22px}
.closebig{position:relative;overflow:hidden;width:100%;border:0;cursor:pointer;font:inherit;text-align:left;color:var(--paper);background:var(--ink);border-radius:28px;padding:22px 22px 20px;box-shadow:0 18px 40px -16px rgba(30,27,24,.55);display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation-delay:calc(var(--i,0)*90ms)}
.closebig::before{content:"";position:absolute;inset:0;background:var(--grad);opacity:.92;z-index:0;transition:opacity .4s}
.closebig>*{position:relative;z-index:1}
.closebig:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 26px 50px -18px rgba(224,27,15,.55)}
.closebig:active{transform:scale(.98)}
.closebig .cb-glow{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 70%);z-index:0;animation:glow 4s ease-in-out infinite}
.cb-who small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cb-who b{display:block;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;margin-top:4px}
.cb-when{text-align:right;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.cb-when em{font-style:normal;font-size:15px;opacity:.9;font-weight:500}
.cb-go{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.35);font-size:14px;font-weight:600;letter-spacing:.04em}
.cb-go i{font-style:normal;display:inline-block;transition:transform .3s}
.closebig:hover .cb-go i{transform:translateX(6px)}
.closebig.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both,ring2 3.2s ease-out calc(var(--i,0)*90ms + .8s) 2}
@keyframes ring2{0%{box-shadow:0 18px 40px -16px rgba(30,27,24,.55),0 0 0 0 rgba(233,162,27,.55)}100%{box-shadow:0 18px 40px -16px rgba(30,27,24,.55),0 0 0 26px rgba(233,162,27,0)}}

.pie-card{padding:18px 16px 20px}
.pie-stage{perspective:700px;display:flex;justify-content:center;margin:6px 0 4px}
.pie-body{transform-box:view-box;transform-origin:160px 92px;animation:pieIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes pieIn{from{opacity:0;transform:scale(.4,0)}to{opacity:1;transform:none}}
.pie-body .ps{transition:transform .35s cubic-bezier(.2,.8,.2,1);transform-box:view-box;cursor:pointer}
.pie-body .ps:hover,.pie-body .ps.hot{transform:translateY(-7px)}
.pie-svg{width:100%;max-width:340px;height:auto;overflow:visible}
.pie-legend{display:grid;gap:8px;margin-top:10px}
.pie-legend div{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;font-size:14px;animation:rise .5s both;animation-delay:calc(var(--i,0)*90ms + 600ms)}
.pie-legend i{width:14px;height:14px;border-radius:5px;background:var(--c)}
.pie-legend span{color:var(--mute)}
.pie-legend b{font-variant-numeric:tabular-nums}
.pie-legend em{font-style:normal;color:var(--mute);font-size:12px;min-width:38px;text-align:right}


.devlink{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:10px;opacity:.75}
.devrow{text-align:center;margin-top:26px}
.delrow .btn.sm{min-height:38px;padding:6px 12px;font-size:13px}
.delrow .btn+.btn{margin-left:6px}
.delrow{gap:10px}

/* zárás-gomb: fényes sáv + pulzáló lejátszó-jel */
.closebig::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.6s 1s infinite;pointer-events:none;z-index:2}
.closebig .cb-go i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-style:normal;font-size:13px;animation:playPulse 1.8s ease-in-out infinite}
@keyframes playPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}60%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}

/* levezetés: animált sorozat */
.dwrap{max-width:560px}
.dstage{text-align:center;margin-top:4px}
.dlbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.dcnt{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(56px,15vw,92px);line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums;transition:color .4s}
.dcnt.down{color:var(--red)}
#dsteps{text-align:left;margin-top:14px}
.dsec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:20px 2px 8px;opacity:0;transform:translateX(-12px);transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1)}
.dsec.in{opacity:1;transform:none}
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px 13px 18px;margin-bottom:8px;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);border-left:6px solid var(--c);opacity:0;transform:translateX(-26px) scale(.98);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.3,1.12)}
.drow.in{opacity:1;transform:none}
.drow>span{min-width:0;flex:1}
.drow b{font-size:16px}
.drow small{display:block;color:var(--mute);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.drow .amt{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--teal)}
.drow .amt.neg{color:var(--red)!important}
.dfin{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:30px;padding:26px 20px 24px;margin-top:22px;box-shadow:0 22px 44px -16px rgba(224,27,15,.7);opacity:0;transform:scale(.86) translateY(14px);transition:opacity .5s,transform .7s cubic-bezier(.2,.9,.3,1.25)}
.dfin::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.dfin.in{opacity:1;transform:none}
.dfin.neg{background:linear-gradient(120deg,#6b1a14,#E01B0F)}
.dfin .lbl{position:relative;display:block;font-family:"DM Serif Display",Georgia,serif;font-size:26px;letter-spacing:.16em}
.dfin b{position:relative;display:block;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(52px,14vw,72px);line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
.dfin small{position:relative;display:block;opacity:.9;font-size:13px;margin-top:6px}
.dlate{opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.dlate.in{opacity:1;transform:none;pointer-events:auto}
#dagain.dlate{margin-top:14px}
</style>

<script type="module">
/* ===================== FIREBASE ===================== */

/* ===================== KÉRDÉSEK ===================== */
const MONEY_STEPS=[
  {key:"opening",     q:"Nyitó összeg a kasszában",          hint:"Mennyi pénz volt a kasszában nyitáskor?", group:"plus"},
  {key:"goorderz",    q:"Napi forgalom (GoOrderz)",          hint:"",                                       group:"plus"},
  {key:"foodbird",    q:"Napi forgalom (Foodbird)",          hint:"",                                       group:"plus"},
  {key:"card",        q:"Bankkártya forgalom",               hint:"",                                       group:"minus"},
  {key:"szep",        q:"SZÉP-kártya forgalom",              hint:"",                                       group:"minus"},
  {key:"cash",        q:"Készpénzes forgalom",               hint:"",                                       group:"minus"},
  {key:"nextOpening", q:"Következő nyitóösszeg a kasszában", hint:"",                                       group:"minus"},
  {key:"salaries",    q:"Fizetések",                         hint:"Add meg, kinek mennyi fizetés ment ki.", type:"list", labelPh:"Név",  group:"minus"},
  {key:"expenses",    q:"Kiadások",                          hint:"Opcionális. Ha nincs, hagyd üresen.",    type:"list", labelPh:"Mire", group:"minus"}
];
const MONEY_KEYS=["opening","goorderz","foodbird","card","szep","cash","nextOpening"];
const LABEL=Object.fromEntries(MONEY_STEPS.filter(s=>!s.type).map(s=>[s.key,s.q]));
const CHECKS=[
  {q:"Lekapcsoltad a klímát?",                         fix:"Kérlek kapcsold le a klímát."},
  {q:"Lekapcsoltad az olajsütőt?",                     fix:"Kérlek kapcsold le az olajsütőt."},
  {q:"A melegentartót és a feltéthűtőt lekapcsoltad?", fix:"Kérlek kapcsold le a melegentartót és a feltéthűtőt."},
  {q:"A terminál a töltőn van?",                       fix:"Kérlek rakd a terminált töltőre."},
  {q:"A telefon a töltőn van?",                        fix:"Kérlek rakd a telefont töltőre."}
];

/* ===================== SEGÉDEK ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ft=n=>Math.round(n||0).toLocaleString("hu-HU")+" Ft";
const fn=n=>Math.round(n||0).toLocaleString("hu-HU");
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const addDays=(iso,n)=>{const [y,m,d]=iso.split("-").map(Number);return dstr(new Date(y,m-1,d+n));};
const hm=()=>new Date().toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"});
const shortDate=s=>{const [,m,d]=s.split("-");return `${m}.${d}.`;};
const todayLabel=()=>new Date().toLocaleDateString("hu-HU",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
const parseAmount=s=>{const n=parseFloat(String(s??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const arr=x=>Array.isArray(x)?x:Object.values(x||{});
const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))/100)*100;
const sumA=list=>(list||[]).reduce((a,x)=>a+(Number(x.amount)||0),0);
const clean=list=>list.map(x=>({name:String(x.name||"").trim(),amount:parseAmount(x.amount)})).filter(x=>x.name||x.amount);
const numVals=src=>{const v={};MONEY_KEYS.forEach(k=>v[k]=Math.round(parseAmount(src[k])));return v;};
const splitLetters=t=>[...t].map((c,i)=>`<span style="--i:${i}">${c===" "?"&nbsp;":esc(c)}</span>`).join("");

/* ===================== REKORDOK ===================== */
// A végösszeg a rekordban a `diff` mezőben van: forgalom − levonások.
function makeRecord({date,closer,values,salaries,expenses,closedAt}){
  const salSum=sumA(salaries),expSum=sumA(expenses);
  const gross=values.opening+values.goorderz+values.foodbird;
  const ded=values.card+values.szep+values.cash+values.nextOpening+salSum+expSum;
  return {date,closer,values,salaries,expenses,closedAt,salSum,expSum,gross,ded,diff:gross-ded,checks:CHECKS.map(c=>c.q)};
}
function recordFromSession(s,id){
  return {...makeRecord({date:today(),closer:s.closer.trim(),values:numVals(s.values),salaries:clean(s.salaries),expenses:clean(s.expenses),closedAt:hm()}),id,hist:[]};
}
function normRec(r,id,date){
  return {...r,id,date:r.date||date,values:r.values||{},salaries:arr(r.salaries),expenses:arr(r.expenses),hist:arr(r.hist)};
}
function seedDemo(){
  const names=["Anna","Bence","Csilla"];const out=[];
  for(let i=1;i<=44;i++){
    if(Math.random()<.2)continue;
    const date=addDays(today(),-i);
    const values={opening:rnd(25000,40000),goorderz:rnd(70000,160000),foodbird:rnd(40000,130000),card:rnd(60000,120000),szep:rnd(6000,25000),cash:rnd(25000,70000),nextOpening:rnd(25000,40000)};
    out.push({...makeRecord({date,closer:names[i%3],values,salaries:[{name:"Bence",amount:rnd(8000,14000)}],expenses:i%4===0?[{name:"Zöldség",amount:rnd(3000,9000)}]:[],closedAt:"21:45"}),id:"seed"+i,hist:[]});
  }
  return out;
}

/* ===================== ÁLLAPOT ===================== */
const S={
  screen:"splash",
  env:"live",            // live | test | demo
  user:null,
  records:[],
  demoRecords:null,
  demoUsed:0,
  demoPhase:0,
  auto:false,
  runId:0,
  session:null,
  stepIdx:0,
  saving:false,
  doneSaved:false,
  period:"ma",           // ma | tegnap | het | honap | naptar
  range:{from:today(),to:today()},
  draft:null,
  orig:null,
  loginErr:"",
  answering:false,
  dir:1,
  lastScreen:null,
  dplay:false,           // levezetés animáció indul a következő rendernél
  dtoken:0,              // régi animációk leállítása
  confirmDel:null
};

/* ===================== ADATOK ===================== */
const dbRef=p=>FB.D.ref(FB.db,p);
async function loadLive(){
  if(!FB)return;
  const snap=await FB.D.get(dbRef(DB_ROOT));
  const v=snap.val()||{};
  const list=[];
  for(const date in v)for(const id in v[date])list.push(normRec(v[date][id],id,date));
  S.records=list;
  const m=await FB.D.get(dbRef("meta/demoRuns"));
  S.demoUsed=m.val()||0;
}
function recsSource(){return S.env==="demo"?(S.demoRecords||[]):S.records;}
function upsert(list,rec){const i=list.findIndex(x=>x.id===rec.id);if(i>=0)list[i]=rec;else list.push(rec);}
function newId(){
  if(S.env==="live"){
    if(!FB)throw new Error("Nincs élő kapcsolat (Firebase nincs beállítva).");
    return FB.D.push(dbRef(`${DB_ROOT}/${today()}`)).key;
  }
  return (S.env==="demo"?"demo":"test")+uid();
}
async function persist(rec){
  if(S.env==="test")return false;
  if(S.env==="demo"){upsert(S.demoRecords,rec);return true;}
  if(!FB)throw new Error("Nincs élő kapcsolat.");
  await FB.D.set(dbRef(`${DB_ROOT}/${rec.date}/${rec.id}`),JSON.parse(JSON.stringify(rec)));
  upsert(S.records,rec);
  return true;
}
async function bumpDemo(){
  if(FB&&S.env==="live"){
    const r=await FB.D.runTransaction(dbRef("meta/demoRuns"),v=>(v||0)<DEMO_LIMIT?(v||0)+1:undefined);
    if(!r.committed){toast("A demó már elfogyott.");return false;}
    S.demoUsed=r.snapshot.val();return true;
  }
  if(S.demoUsed>=DEMO_LIMIT){toast("A demó már elfogyott.");return false;}
  S.demoUsed++;return true;
}
const demoLeft=()=>Math.max(0,DEMO_LIMIT-S.demoUsed);

/* ===================== SZŰRÉS, ÖSSZESÍTÉS ===================== */
function periodRecords(){
  const recs=recsSource(),t=today();
  switch(S.period){
    case "ma":     return recs.filter(r=>r.date===t);
    case "tegnap": return recs.filter(r=>r.date===addDays(t,-1));
    case "het":{const ws=addDays(t,-((new Date().getDay()+6)%7));return recs.filter(r=>r.date>=ws&&r.date<=t);}
    case "honap":  return recs.filter(r=>r.date.slice(0,7)===t.slice(0,7));
    case "naptar":{let {from,to}=S.range;if(from>to)[from,to]=[to,from];return recs.filter(r=>r.date>=from&&r.date<=to);}
  }
  return [];
}
const sortedRecs=list=>[...list].sort((a,b)=>(b.date+(b.closedAt||"")).localeCompare(a.date+(a.closedAt||"")));
function sums(list){
  const o={gross:0,goo:0,foo:0,card:0,szep:0,cash:0,sal:0,exp:0,diff:0};
  list.forEach(r=>{o.gross+=r.gross;o.goo+=r.values.goorderz||0;o.foo+=r.values.foodbird||0;o.card+=r.values.card||0;o.szep+=r.values.szep||0;o.cash+=r.values.cash||0;o.sal+=r.salSum;o.exp+=r.expSum;o.diff+=r.diff;});
  return o;
}
const periodLabel=()=>({
  ma:`Ma (${today()})`,tegnap:`Tegnap (${addDays(today(),-1)})`,
  het:"Hét (hétfőtől ma)",honap:`Hónap: ${today().slice(0,7)}`,
  naptar:`${S.range.from} – ${S.range.to}`
}[S.period]);

/* ===================== NÉZETEK ===================== */
const logo=()=>`<svg class="logo" viewBox="0 0 300 190" role="img" aria-label="A Menza">
  <circle class="c c1" cx="55" cy="58" r="50" fill="#E9A21B"/>
  <circle class="c c2" cx="150" cy="58" r="50" fill="#17B69A"/>
  <circle class="c c3" cx="245" cy="58" r="50" fill="#E01B0F"/>
  <g class="cut" fill="#EDE6D3">
    <rect x="41" y="20" width="4" height="24" rx="2"/><rect x="49" y="20" width="4" height="24" rx="2"/><rect x="57" y="20" width="4" height="24" rx="2"/>
    <rect x="41" y="40" width="20" height="14" rx="7"/><rect x="48" y="52" width="6" height="44" rx="3"/>
    <ellipse cx="150" cy="46" rx="13" ry="18"/><rect x="147.5" y="62" width="5" height="42" rx="2.5"/>
    <path d="M240 16 Q252 28 252 46 L252 64 L240 64 Z"/><rect x="240" y="62" width="7" height="46" rx="3"/>
  </g>
  <text class="wm" x="150" y="150" text-anchor="middle" font-family="DM Serif Display, Georgia, serif" font-size="62" fill="#1E1B18">A Menza</text>
  <rect class="ul u1" x="36" y="166" width="75" height="5" rx="2.5" fill="#E9A21B"/>
  <rect class="ul u2" x="111" y="166" width="78" height="5" rx="2.5" fill="#17B69A"/>
  <rect class="ul u3" x="189" y="166" width="75" height="5" rx="2.5" fill="#E01B0F"/>
</svg>`;

const ICON_OUT='<svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_BACK='←';

const top=(kicker,title,right="")=>`<div class="topbar"><div class="mark">${logo()}</div><div class="hello"><div class="kicker">${kicker}</div><h1 class="serif">${title}</h1></div>${right}</div>`;

function banner(){
  if(S.env==="test")return `<div class="demo-banner">✦ TESZT – semmi nem mentődik<span class="sp"></span><button class="btn" data-act="exitenv">Kilépés</button></div>`;
  if(S.env==="demo"){
    const names={1:"alkalmazotti nézet",2:"admin nézet"};
    return `<div class="demo-banner">✦ DEMÓ ${S.demoPhase}/2 · ${names[S.demoPhase]||""} · semmi nem mentődik<span class="sp"></span><button class="btn" data-act="exitdemo">Kilépés a demóból</button></div>`;
  }
  return "";
}

/* ===================== LEVEZETÉS: ANIMÁLT SOROZAT (futár runClose mintájára) ===================== */
const dsleep=ms=>new Promise(res=>setTimeout(res,ms));
const vib=()=>{if(navigator.vibrate)navigator.vibrate(18);};
function dtween(el,from,to,ms){
  return new Promise(res=>{
    const t0=performance.now();
    const f=now=>{
      if(!el.isConnected)return res();
      const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);
      el.textContent=ft(from+(to-from)*e);
      if(p<1)requestAnimationFrame(f);else res();
    };
    requestAnimationFrame(f);
  });
}
function deriveData(r){
  const v=r.values;
  const plus=[
    {l:"Nyitó összeg",v:v.opening,c:"#7A7266"},
    {l:"GoOrderz",v:v.goorderz,c:"#17B69A"},
    {l:"Foodbird",v:v.foodbird,c:"#17B69A"}
  ];
  const minus=[
    {l:"Bankkártya",v:v.card,c:"#E9A21B"},
    {l:"SZÉP",v:v.szep,c:"#E9A21B"},
    {l:"Készpénz",v:v.cash,c:"#E01B0F"},
    {l:"Következő nyitó",v:v.nextOpening,c:"#7A7266"},
    ...r.salaries.map(x=>({l:"Fizetés · "+x.name,v:x.amount,c:"#1E1B18"})),
    ...r.expenses.map(x=>({l:"Kiadás · "+x.name,v:x.amount,c:"#1E1B18"}))
  ];
  return {plus,minus,diff:r.diff};
}
function drowEl(x,sign,bal){
  const el=document.createElement("div");
  el.className="drow";
  el.style.setProperty("--c",x.c);
  el.innerHTML=`<span><b>${esc(x.l)}</b><small>Futó egyenleg: ${ft(bal)}</small></span><b class="amt ${sign==="+"?"":"neg"}">${sign} ${ft(x.v)}</b>`;
  return el;
}
async function playDerive(){
  const token=++S.dtoken;
  const cnt=document.getElementById("dcnt"),steps=document.getElementById("dsteps"),fin=document.getElementById("dfinal");
  if(!cnt||!S.orig)return;
  const ok=()=>S.dtoken===token&&document.getElementById("dcnt");
  const reveal=el=>{requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("in")));};
  const add=el=>{steps.appendChild(el);reveal(el);vib();};
  const sec=t=>{const h=document.createElement("div");h.className="dsec";h.textContent=t;steps.appendChild(h);reveal(h);};
  const d=deriveData(S.orig);
  let bal=0;

  await dsleep(400);if(!ok())return;
  sec("Forgalom");
  for(const x of d.plus){
    await dsleep(380);if(!ok())return;
    const from=bal;bal+=x.v;
    add(drowEl(x,"+",bal));
    await dtween(cnt,from,bal,750);if(!ok())return;
  }

  await dsleep(450);if(!ok())return;
  sec("Levonások");
  for(const x of d.minus){
    await dsleep(300);if(!ok())return;
    const from=bal;bal-=x.v;
    add(drowEl(x,"−",bal));
    cnt.classList.add("down");
    await dtween(cnt,from,bal,650);if(!ok())return;
  }

  await dsleep(500);if(!ok())return;
  const neg=d.diff<0;
  fin.innerHTML=`<div class="dfin${neg?" neg":""}"><span class="lbl">VÉGÖSSZEG</span><b id="dfb">0 Ft</b><small>forgalom − levonások</small></div>`;
  const box=fin.firstElementChild;reveal(box);vib();
  const fb=document.getElementById("dfb");
  await Promise.all([dtween(fb,0,d.diff,1500),dtween(cnt,bal,d.diff,1500)]);
  if(!ok())return;
  if(!neg)confetti();
  document.getElementById("dagain")?.classList.add("in");
  document.getElementById("ddone")?.classList.add("in");
}

/* 3D kördiagram (SVG): ellipszis-szeletek, lefelé vastagítva, a szeletek hoverre kiemelkednek */
const PIE_COLS=["#17B69A","#E9A21B","#E01B0F","#1E1B18","#8A7F6B"];
function shade(hex,k){
  const n=parseInt(hex.slice(1),16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(x=>Math.round(x*k));
  return "#"+c.map(x=>x.toString(16).padStart(2,"0")).join("");
}
function pie3d(items){
  const pos=items.map(([l,v])=>({l,v:Math.max(0,v||0)}));
  const tot=pos.reduce((a,x)=>a+x.v,0);
  if(!tot)return `<div class="empty">Nincs adat ebben az időszakban.</div>`;
  const cx=160,cy=88,rx=128,ry=62,D=14;
  let a=-Math.PI/2;
  const segs=[];
  pos.forEach((x,i)=>{
    if(x.v<=0)return;
    const f=x.v/tot,a1=a+f*2*Math.PI;
    segs.push({c:PIE_COLS[i%PIE_COLS.length],a0:a,a1,f,l:x.l,v:x.v});
    a=a1;
  });
  const P=(ang,dy)=>[cx+rx*Math.cos(ang),cy+ry*Math.sin(ang)+dy];
  const path=(s,dy)=>{
    if(s.f>=0.9999)return `<ellipse cx="${cx}" cy="${cy+dy}" rx="${rx}" ry="${ry}"/>`;
    const [x0,y0]=P(s.a0,dy),[x1,y1]=P(s.a1,dy);
    const large=s.a1-s.a0>Math.PI?1:0;
    return `<path d="M${cx} ${cy+dy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${rx} ${ry} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z"/>`;
  };
  const groups=segs.map((s,i)=>{
    let walls="";
    const dark=shade(s.c,.55);
    for(let k=D;k>=1;k--)walls+=`<g fill="${dark}">${path(s,k*1.2)}</g>`;
    const top=`<g fill="${s.c}">${path(s,0)}</g>`;
    return `<g class="ps" style="--i:${i}" data-seg="${i}">${walls}${top}</g>`;
  }).join("");
  const legend=segs.map((s,i)=>`<div style="--i:${i};--c:${s.c}"><i></i><span>${s.l}</span><b>${ft(s.v)}</b><em>${Math.round(s.f*100)}%</em></div>`).join("");
  return `<div class="pie-stage"><svg class="pie-svg" viewBox="0 0 320 ${cy+ry+D*1.2+14}" role="img" aria-label="Forgalom összetétele">
      <g class="pie-body">${groups}</g></svg></div>
    <div class="pie-legend">${legend}</div>`;
}

/* Pontos idő: a logó három köre (óra · perc · másodperc), a másodperc-kör gyűrűjével */
const RING_LEN=2*Math.PI*46;
function bump(el){el.classList.remove("tick");void el.offsetWidth;el.classList.add("tick");}
function updateClock(){
  const d=document.getElementById("date"),now=new Date();
  const h=document.getElementById("ch"),m=document.getElementById("cm"),s=document.getElementById("cs"),ring=document.getElementById("cring");
  if(h&&h.textContent!==String(now.getHours()).padStart(2,"0")){h.textContent=String(now.getHours()).padStart(2,"0");bump(h);}
  if(m&&m.textContent!==String(now.getMinutes()).padStart(2,"0")){m.textContent=String(now.getMinutes()).padStart(2,"0");bump(m);}
  if(s){s.textContent=String(now.getSeconds()).padStart(2,"0");bump(s);}
  if(ring)ring.style.strokeDashoffset=(RING_LEN*(1-now.getSeconds()/60)).toFixed(2);
  if(d)d.textContent=now.toLocaleDateString("hu-HU",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
setInterval(updateClock,1000);

function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600);
}

/* ===================== EFFEKTEK ===================== */
function tween(el,from,to,ms,fmt=ft){
  const t0=performance.now();
  const f=now=>{
    const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e);
    if(p<1)requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
function animateKpis(){
  document.querySelectorAll(".kpi b").forEach(el=>{
    const raw=el.textContent;
    const n=parseInt(raw.replace(/[^0-9]/g,""))||0;
    if(n)tween(el,0,raw.includes("-")?-n:n,900,ft);
  });
}
function confetti(){
  const cols=["#E9A21B","#17B69A","#E01B0F","#1E1B18","#FBF8F1"];
  for(let i=0;i<64;i++){
    const s=document.createElement("span");
    s.className="confetti";
    s.style.left=(40+Math.random()*20)+"vw";
    s.style.top="40vh";
    s.style.background=cols[i%cols.length];
    s.style.setProperty("--dx",(Math.random()*240-120)+"px");
    s.style.setProperty("--dy",(-220-Math.random()*320)+"px");
    s.style.setProperty("--rot",(Math.random()*720-360)+"deg");
    s.style.animationDelay=(Math.random()*.2)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),2600);
  }
  if(navigator.vibrate)navigator.vibrate([20,40,20]);
}

/* ===================== ZÁRÁS (alkalmazotti) ===================== */
function newSession(){return {closer:"",values:{},salaries:[],expenses:[],checkIdx:0,blocked:false};}
function startClose(env){S.env=env;S.session=newSession();S.stepIdx=0;S.screen="closer";render();}
function goHome(){S.env="live";S.session=null;S.screen="home";render();}

async function finishClosing(){
  if(S.saving)return;
  S.saving=true;S.screen="saving";render();
  try{
    const rec=recordFromSession(S.session,newId());
    S.doneSaved=await persist(rec);
    S.session=null;S.screen="done";
  }catch(e){
    S.screen="review";toast("Mentési hiba: "+e.message);
  }
  S.saving=false;render();
}

/* ===================== ADMIN: RÉSZLETEK, SZERKESZTÉS ===================== */
function openRec(id){
  const r=recsSource().find(x=>x.id===id);if(!r)return;
  S.orig=r;
  S.draft={closer:r.closer,values:Object.fromEntries(MONEY_KEYS.map(k=>[k,String(r.values[k]??0)])),
    salaries:r.salaries.map(x=>({name:x.name,amount:String(x.amount)})),
    expenses:r.expenses.map(x=>({name:x.name,amount:String(x.amount)}))};
  S.screen="detail";render();
}
function openDerive(id){
  const r=recsSource().find(x=>x.id===id);if(!r)return;
  S.orig=r;S.screen="derive";S.dplay=true;render();
}
async function saveDetail(){
  const d=S.draft,o=S.orig;
  if(S.env==="test")return toast("Teszt módban nem menthető.");
  const changes=[];const name=d.closer.trim();
  if(name&&name!==o.closer)changes.push(`záró: ${o.closer} → ${name}`);
  const v=numVals(d.values);
  MONEY_KEYS.forEach(k=>{if(v[k]!==o.values[k])changes.push(`${LABEL[k]}: ${ft(o.values[k])} → ${ft(v[k])}`);});
  const sal=clean(d.salaries),exp=clean(d.expenses);
  if(JSON.stringify(sal)!==JSON.stringify(o.salaries))changes.push("fizetések módosítva");
  if(JSON.stringify(exp)!==JSON.stringify(o.expenses))changes.push("kiadások módosítva");
  if(!changes.length)return toast("Nincs módosítás.");
  const hist=[...o.hist,{time:hm(),text:changes.join(" · ")}];
  const rec={...makeRecord({date:o.date,closer:name||o.closer,values:v,salaries:sal,expenses:exp,closedAt:o.closedAt}),id:o.id,hist};
  try{
    await persist(rec);
    S.orig=rec;
    toast("Mentve. A módosítás naplózva.");
    S.screen="admin";
  }catch(e){toast("Mentési hiba: "+e.message);}
  render();
}

/* ===================== DEMÓ (automata, 2×) ===================== */
async function runDemo(){
  if(S.env!=="live")return;
  if(demoLeft()<=0)return toast("A demó már elfogyott.");
  if(!(await bumpDemo()))return;
  const id=++S.runId;
  const alive=()=>S.runId===id;
  S.env="demo";S.auto=true;S.demoRecords=seedDemo();S.demoPhase=1;
  S.session=newSession();S.stepIdx=0;S.screen="closer";render();
  await sleep(700);if(!alive())return;
  for(const ch of "Demó Anna"){S.session.closer+=ch;render();await sleep(90);if(!alive())return;}
  await sleep(400);if(!alive())return;

  S.screen="money";
  const vals=["30000","118500","72300","84200","11800","41000","30000"];
  for(let i=0;i<vals.length;i++){
    S.stepIdx=i;S.session.values[MONEY_STEPS[i].key]=vals[i];render();
    await sleep(600);if(!alive())return;
  }
  S.stepIdx=7;
  S.session.salaries.push({name:"Bence",amount:"9500"});render();await sleep(600);if(!alive())return;
  S.session.salaries.push({name:"Csilla",amount:"8200"});render();await sleep(600);if(!alive())return;
  S.session.salaries.push({name:"Dóra",amount:"7400"});render();await sleep(600);if(!alive())return;
  S.stepIdx=8;
  S.session.expenses.push({name:"Zöldség",amount:"6400"});render();await sleep(700);if(!alive())return;

  S.screen="checks";
  S.session.checkIdx=0;S.session.blocked=true;render();await sleep(1400);if(!alive())return;
  S.session.blocked=false;render();await sleep(400);if(!alive())return;
  for(let i=0;i<CHECKS.length;i++){S.session.checkIdx=i;render();await sleep(450);if(!alive())return;}

  S.screen="review";render();await sleep(1800);if(!alive())return;
  await finishClosing();
  await sleep(2200);if(!alive())return;

  // 2. fázis: admin nézet
  S.demoPhase=2;S.screen="admin";S.period="ma";render();
  await sleep(1800);if(!alive())return;
  const last=recsSource().find(r=>r.date===today()&&r.id.startsWith("demo"));
  if(last){openDerive(last.id);await sleep(9000);if(!alive())return;}
  S.auto=false;S.screen="admin";S.orig=null;render();
}
function exitDemo(){
  S.runId++;S.auto=false;S.env="live";S.demoRecords=null;S.demoPhase=0;S.session=null;
  S.screen="admin";render();
}
function exitEnv(){
  S.runId++;S.auto=false;S.env="live";S.session=null;
  S.screen="admin";render();
}

/* ===================== EXPORT ===================== */
function exportXlsx(){
  const list=sortedRecs(periodRecords());
  if(!list.length)return toast("Nincs exportálható adat.");
  if(!window.XLSX)return toast("Az Excel-modul nem töltött be.");
  const wb=XLSX.utils.book_new();
  const rows=list.map(r=>({"Dátum":r.date,"Záró":r.closer,"Zárás":r.closedAt||"","Nyitó":r.values.opening,"GoOrderz":r.values.goorderz,"Foodbird":r.values.foodbird,"Forgalom":r.gross,"Bankkártya":r.values.card,"SZÉP":r.values.szep,"Készpénz":r.values.cash,"Következő nyitó":r.values.nextOpening,"Fizetések":r.salSum,"Kiadások":r.expSum,"Végösszeg":r.diff,"Módosítva":r.hist.length?"igen":"nem"}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Zárások");
  const pay=[];list.forEach(r=>r.salaries.forEach(x=>pay.push({"Dátum":r.date,"Név":x.name,"Összeg":x.amount})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pay.length?pay:[{"Dátum":"","Név":"","Összeg":""}]),"Fizetések");
  const exp=[];list.forEach(r=>r.expenses.forEach(x=>exp.push({"Dátum":r.date,"Megnevezés":x.name,"Összeg":x.amount})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(exp.length?exp:[{"Dátum":"","Megnevezés":"","Összeg":""}]),"Kiadások");
  XLSX.writeFile(wb,`menza-zaras_${S.period}_${today()}.xlsx`);
}

    .top{display:flex;align-items:center;gap:22px}
    .top svg{width:150px;height:auto;flex:none}
    .tot td{font-weight:bold;border-top:2px solid #1E1B18}
    @media print{body{margin:14mm}}</style></head><body>
    <div class="top">${logo()}<div><h1>Zárási kimutatás</h1><div class="sub">${esc(periodLabel())} · összegek Ft-ban</div></div></div>
    <div class="bar"></div>
    <table><thead><tr><th>Dátum</th><th>Záró</th><th class="n">Forgalom</th><th class="n">Bankkártya</th><th class="n">SZÉP</th><th class="n">Készpénz</th><th class="n">Fizetések</th><th class="n">Kiadások</th><th class="n">Végösszeg</th></tr></thead>

  w.document.open();w.document.write(html);w.document.close();

/* ===================== BELÉPÉS, KIJELENTKEZÉS ===================== */
async function doLogin(u,p){
  if(!FB){
    if(u===ADMIN_USER&&p==="teszt"){S.user={name:ADMIN_USER};return;}
    throw Object.assign(new Error("bad"),{code:"auth/invalid"});
  }
  await FB.A.signInWithEmailAndPassword(FB.auth,`${u}@${ADMIN_DOMAIN}`,p);
}
/* ===================== FEJLESZTŐI MENÜ: ZÁRÁS TÖRLÉSE ===================== */
async function deleteRec(id){
  const r=S.records.find(x=>x.id===id);
  if(!r)return;
  if(!FB)return toast("Nincs élő kapcsolat, nem törölhető.");
  try{
    await FB.D.remove(dbRef(`${DB_ROOT}/${r.date}/${r.id}`));
  }catch(e){return toast("Törlési hiba: "+e.message);}
  S.records=S.records.filter(x=>x.id!==id);
  S.confirmDel=null;
  toast("A zárás törölve.");
  render();
}

async function logout(){
  if(FB&&S.env==="live"){try{await FB.A.signOut(FB.auth);}catch(e){}}
  S.user=null;S.records=[];S.demoUsed=0;S.screen="home";render();
}

/* ===================== ESEMÉNYEK ===================== */
const actions={
  home:()=>goHome(),
  admin:()=>{
    S.loginErr="";
    if(S.user){S.screen="admin";render();return;}
    S.screen="login";render();
  },
  startclose:()=>startClose("live"),
  toMoney:()=>{
    const v=$("#closer")?.value??S.session.closer;
    if(!v.trim())return toast("Add meg a neved.");
    S.session.closer=v.trim();S.stepIdx=0;S.screen="money";render();
  },
  prevStep:()=>{S.dir=-1;if(S.stepIdx>0){S.stepIdx--;render();}else{S.screen="closer";render();}},
  nextStep:()=>{
    const st=MONEY_STEPS[S.stepIdx];
    if(st.type!=="list"){
      const v=S.session.values[st.key];
      if(v===undefined||String(v).trim()==="")return toast("Add meg az összeget (0 is lehet).");
    }
    S.dir=1;
    if(S.stepIdx<MONEY_STEPS.length-1){
      S.stepIdx++;
      if(MONEY_STEPS[S.stepIdx].key==="salaries"&&!S.session.salaries.length){
        for(let k=0;k<3;k++)S.session.salaries.push({name:"",amount:""});
      }
    }
    else{S.session.checkIdx=0;S.session.blocked=false;S.screen="checks";}
    render();
  },
  addRow:el=>{S.session[el.dataset.list].push({name:"",amount:""});S.justAdded=true;render();},
  delRow:el=>{S.session[el.dataset.list].splice(+el.dataset.i,1);render();},
  answer:el=>{
    if(el.dataset.v==="0"){S.session.blocked=true;return render();}
    if(S.answering)return;
    S.answering=true;
    document.querySelector(".qcard")?.classList.add("pulse-ok");
    setTimeout(()=>{
      S.answering=false;
      S.session.checkIdx++;
      if(S.session.checkIdx>=CHECKS.length)S.screen="review";
      render();
    },420);
  },
  unblock:()=>{S.session.blocked=false;render();},
  backMoney:()=>{S.stepIdx=MONEY_STEPS.length-1;S.screen="money";render();},
  editFromStart:()=>{S.stepIdx=0;S.screen="money";render();},
  finish:()=>finishClosing(),
  period:el=>{S.period=el.dataset.p;render();},
  refresh:async()=>{try{await loadLive();toast("Frissítve.");}catch(e){toast("Hiba: "+e.message);}render();},
  openRec:el=>openRec(el.dataset.id),
  derive:el=>openDerive(el.dataset.id),
  derivePlay:()=>{S.dplay=true;render();},
  adminBack:()=>{S.screen="admin";S.orig=null;render();},
  saveDetail:()=>saveDetail(),
  dAdd:el=>{S.draft[el.dataset.list].push({name:"",amount:""});render();},
  dDel:el=>{S.draft[el.dataset.list].splice(+el.dataset.i,1);render();},
  devmenu:()=>{S.confirmDel=null;S.screen="devmenu";render();},
  delAsk:el=>{S.confirmDel=el.dataset.id;render();},
  delNo:()=>{S.confirmDel=null;render();},
  delYes:el=>deleteRec(el.dataset.id),
  testmode:()=>startClose("test"),
  demo:()=>runDemo(),
  exitenv:()=>exitEnv(),
  exitdemo:()=>exitDemo(),
  exportXlsx:()=>exportXlsx(),
  exportPdf:()=>exportPdf(),
  logout:()=>logout()
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el||el.disabled)return;
  const name=el.dataset.act;
  if(S.auto&&!["exitdemo","exitenv"].includes(name))return;
  const fn=actions[name];if(fn)fn(el);
});

/* input-kezelés: nem renderel újra, így nem veszik el a fókusz */
const inputs={
  closer:el=>{S.session.closer=el.value;},
  val:el=>{S.session.values[el.dataset.k]=el.value;},
  row:el=>{S.session[el.dataset.list][+el.dataset.i][el.dataset.f]=el.value;},
  dCloser:el=>{S.draft.closer=el.value;},
  dVal:el=>{S.draft.values[el.dataset.k]=el.value;},
  dRow:el=>{S.draft[el.dataset.list][+el.dataset.i][el.dataset.f]=el.value;}
};
document.addEventListener("input",e=>{const f=inputs[e.target.dataset.in];if(f&&!S.auto)f(e.target);});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.in==="range"){S.range[t.dataset.k]=t.value||S.range[t.dataset.k];render();}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const t=e.target;
  if(t.dataset.in==="closer"){e.preventDefault();actions.toMoney();}
  if(t.dataset.in==="val"){e.preventDefault();actions.nextStep();}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target;if(f.dataset.form!=="login")return;
  try{
    await doLogin(f.elements.u.value.trim(),f.elements.p.value);
    S.user={name:f.elements.u.value.trim()};S.loginErr="";
    if(FB)await loadLive();
    S.screen="admin";
  }catch(ex){
    const c=ex.code||"";
    S.loginErr=c.startsWith("auth/")||c.includes("invalid")?"Hibás felhasználónév vagy jelszó.":"Hiba: "+(ex.message||c);
  }
  render();
});

/* ===================== INDULÁS ===================== */
if(FB){
  FB.A.onAuthStateChanged(FB.auth,async user=>{
    if(user){
      S.user={name:user.email?.split("@")[0]||ADMIN_USER};
      try{await loadLive();}catch(e){}
      if(S.screen==="login"){S.screen="admin";render();}
      else if(S.screen==="admin"&&S.env==="live"){render();}
    }else if(S.user){
      S.user=null;S.records=[];
      if(S.screen==="admin"&&S.env==="live"){S.screen="home";render();}
    }
  });
}
render();
setTimeout(()=>{if(S.screen==="splash"){S.screen="home";render();}},2300);
</script>
